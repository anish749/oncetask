# Outbound link configuration for oncetask-admin.
#
# Two kinds of entries:
#   - global: shown on every task regardless of type
#   - types.<typeName>: shown only when task.type equals <typeName>
#
# Each link has:
#   label    - button text
#   url      - URL template; {placeholder} segments resolve against the task
#              and are URL-encoded automatically. Pre-encode the surrounding
#              URL structure when needed (paste from your browser address bar).
#   requires - optional list of task-field paths that must resolve to non-empty
#              values for this link to render. Pure non-empty check, no DSL.
#   primary  - optional. When true, the link also appears as an icon in the
#              list row, not just in the detail pane.
#
# Available top-level fields on a task: id, type, resourceKey, env, waitUntil,
# leasedUntil, createdAt, doneAt, attempts, isCancelled, cancelledAt,
# parentRecurrenceId, occurrenceTimestamp. Task-specific fields live under data.

global:
  # Cloud Logging filtered by taskId. Always available because `id` always exists.
  - label: View logs (by task)
    url: "https://console.cloud.google.com/logs/query;query=jsonPayload.taskId%3D%22{id}%22;duration=P30D?project=my-project-id"
    primary: true

  # Cloud Logging filtered by resourceKey - only shows when resourceKey is set.
  - label: View logs (by resource)
    requires: [resourceKey]
    url: "https://console.cloud.google.com/logs/query;query=jsonPayload.resourceKey%3D%22{resourceKey}%22;duration=P30D?project=my-project-id"

types:
  # Example: a task type whose data carries an order ID. The link only renders
  # when data.orderId is present, and the value is URL-encoded automatically.
  processOrder:
    label: "Process Order"
    links:
      - label: Open in admin console
        requires: [data.orderId]
        url: "https://your-app.example.com/orders/{data.orderId}"

  # Example: a task type whose resourceKey is the entity it operates on.
  syncUser:
    label: "Sync User"
    links:
      - label: Open user profile
        requires: [resourceKey]
        url: "https://your-app.example.com/users/{resourceKey}"
